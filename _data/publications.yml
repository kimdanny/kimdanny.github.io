- title: "Tip of the Tongue Query Elicitation for Simulated Evaluation"
  authors: ["Yifan He*", "To Eun Kim*", "Fernando Diaz", "Jaime Arguello", "Bhaskar Mitra"]
  equal_note: true
  year: 2025
  venue: "SIGIR 2025"
  venue_full: "48th ACM SIGIR Conference on Research and Development in Information Retrieval"
  topics: [tot, eval]
  image: /images/tot-elicitation.png
  tldr: >
    We introduce methods for eliciting tip-of-the-tongue (ToT) queries using large
    language models and human participants, enabling scalable and systematic
    evaluation of ToT retrieval systems. Our LLM-based simulator generates synthetic
    ToT queries that align well with human-created ones, while our human elicitation
    interface uses visual stimuli to induce the ToT state. Our LLM-elicited queries are
    featured in the TREC 2024 ToT track, with human-elicited queries in TREC 2025.
  links:
    paper: "https://doi.org/10.1145/3726302.3730335"
    LLM elicitation code: "https://github.com/kimdanny/llm-tot-query-elicitation"
    human elicitation code: "https://github.com/kimdanny/human-tot-query-elicitation-mturk"

- title: "Towards Fair RAG: On the Impact of Fair Ranking in Retrieval-Augmented Generation"
  authors: ["To Eun Kim", "Fernando Diaz"]
  year: 2025
  venue: "ICTIR 2025"
  venue_full: "The 15th Int'l Conference on Innovative Concepts and Theories in Information Retrieval"
  also: "NeurIPS 2024 AFME Workshop — Top-3 Spotlight"
  topics: [deployment]
  selected: true
  image: /images/fair-rag.png
  tldr: >
    We conduct the first comprehensive study of fairness-aware ranking in RAG systems,
    covering both ranking fairness and attribution fairness — ensuring balanced exposure
    of retrieved documents and equitable crediting of sources. Analyzing 12 RAG models
    across 7 tasks, we find that fairness-aware retrieval often maintains or enhances
    both ranking effectiveness and generation quality.
  links:
    paper: "https://doi.org/10.1145/3731120.3744599"
    code: "https://github.com/kimdanny/Fair-RAG"

- title: "Retrieval-Enhanced Machine Learning: Synthesis and Opportunities"
  authors: ["To Eun Kim", "Alireza Salemi", "Andrew Drozdov", "Fernando Diaz", "Hamed Zamani"]
  year: 2024
  venue: "SIGIR 2025 Tutorial"
  also: "SIGIR-AP 2024 Tutorial"
  topics: [retrievers, survey]
  selected: true
  image: /images/reml-survey.png
  tldr: >
    We posit that the paradigm of retrieval-enhancement can be extended to a broader
    spectrum of machine learning — computer vision, time series prediction, and
    computational biology — not just NLP. We introduce a formal framework of
    Retrieval-Enhanced Machine Learning (REML), synthesizing literature across domains
    under consistent notation.
  links:
    paper: "https://arxiv.org/abs/2407.12982"
    SIGIR 2025 tutorial: "https://doi.org/10.1145/3726302.3731695"
    SIGIR-AP 2024 tutorial: "https://doi.org/10.1145/3673791.3698439"
    website: "https://retrieval-enhanced-ml.github.io"

