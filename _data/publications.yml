- title: "Evaluation of Information Access Agents under Simulated AI Marketplace Dynamics"
  authors: ["To Eun Kim", "Alireza Salemi", "Hamed Zamani", "Fernando Diaz"]
  year: 2026
  venue: "SIGIR 2026 (Perspectives)"
  venue_full: "49th ACM SIGIR Conference on Research and Development in Information Retrieval"
  topics: [agent-econ, eval]
  selected: true
  image: /images/marketplace.png
  tldr: >
    We introduce Marketplace Evaluation, a simulation-based paradigm that evaluates
    information access systems as participants in a competitive marketplace. By
    simulating repeated interactions and evolving user and agent preferences, the
    framework enables longitudinal evaluation and marketplace-level metrics, such as
    retention and market share, that complement and can extend beyond traditional
    accuracy-based metrics.
  links:
    paper: "https://dl.acm.org/doi/10.1145/3805712.3808542"
    code: "https://github.com/kimdanny/marketplace-eval"

- title: "LTRR: Learning To Rank Retrievers for LLMs"
  authors: ["To Eun Kim", "Fernando Diaz"]
  year: 2026
  venue: "SIGIR 2026"
  venue_full: "49th ACM SIGIR Conference on Research and Development in Information Retrieval"
  also: "SIGIR 2025 LiveRAG Workshop — Spotlight"
  topics: [retrievers]
  selected: true
  image: /images/ltrr.png
  tldr: >
    Ranking the rankers. We explore a query routing approach that dynamically selects
    from a pool of retrievers based on the query, using both train-free heuristics and
    learned routing models. We frame routing as a learning-to-rank (LTR) problem and
    introduce LTRR, a framework that learns to rank retrievers by their expected
    utility gain to downstream LLM performance.
  links:
    paper: "https://dl.acm.org/doi/10.1145/3805712.3809954"
    arXiv: "https://arxiv.org/abs/2506.13743"
    code: "https://github.com/kimdanny/Starlight-LiveRAG"

