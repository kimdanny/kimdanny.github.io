- title: "Multi-Agent Transactive Memory"
  authors: ["To Eun Kim*", "Xuhong He*", "Dishank Jain*", "Ambuj Agrawal",
            "Negar Arabzadeh", "Fernando Diaz"]
  equal_note: true
  year: 2026
  venue: "COLM 2026 Lifelong Agents Workshop"
  venue_note: "Oral"
  topics: [agent-econ]
  selected: true
  image: /images/matm.png
  tldr: >
    We propose Multi-Agent Transactive Memory (MATM), a framework for
    population-level storage and retrieval of agent-generated trajectories, where
    producer agents contribute trajectories to a shared repository and consumer
    agents retrieve them to improve task execution.
  links:
    paper: "https://arxiv.org/abs/2606.19911"
    code: "https://github.com/kimdanny/matm"
    dataset: "https://huggingface.co/datasets/toeunkim/matm-trajectories"

