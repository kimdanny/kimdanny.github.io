- title: "Condita: A State Machine Like Architecture for Multi-Modal Task Bots"
  authors: ["Jerome Ramos*", "To Eun Kim*", "Z. Shi", "X. Fu", "F. Ye", "Y. Feng", "Aldo Lipani"]
  equal_note: true
  year: 2022
  venue: "Alexa Prize TaskBot Challenge Proceedings"
  topics: [deployment, tech-report]
  image: /images/condita-before.png
  tldr: >
    We present the COoking-aNd-DIy-TAsk-based (Condita) task-oriented dialogue system
    for the first Alexa Prize TaskBot Challenge. Condita is a multi-modal agent that
    assists users with cooking and home improvement tasks; we discuss its state
    machine like architecture and the conversational strategies behind its performance.
  links:
    paper: "https://www.amazon.science/alexa-prize/proceedings/condita-a-state-machine-like-architecture-for-multi-modal-task-bots"

- title: "When and What to Ask Through World States and Text Instructions: IGLU NLP Challenge Solution"
  authors: ["Z. Shi*", "Jerome Ramos*", "To Eun Kim", "X. Wang", "H. Rahmani", "Aldo Lipani"]
  equal_note: true
  year: 2022
  venue: "NeurIPS 2022 Competition — IGLU"
  venue_full: "Interactive Grounded Language Understanding in a Collaborative Environment"
  award: "🏆 Research Prize Winner"
  topics: [deployment, tech-report]
  image: /images/iglu-chall.png
  tldr: >
    We address two questions in the IGLU NLP task: when should an agent ask for
    clarification, and what clarification question should it ask. Our classification
    model reaches an F1 of 0.757 (3rd on the leaderboard), and our ranking model
    reaches roughly 0.38 MRR by extending a traditional ranking model.
  links:
    paper: "https://arxiv.org/abs/2305.05754"

- title: "Attention-based Ingredient Phrase Parser"
  authors: ["Z. Shi", "P. Ni", "M. Wang", "To Eun Kim", "Aldo Lipani"]
