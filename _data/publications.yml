- title: "A Comprehensive Survey on Generative Diffusion Models for Structured Data"
  authors: ["Heejoon Koo", "To Eun Kim"]
  year: 2023
  venue: "Preprint"
  topics: [survey]
  image: /images/diffusion-survey.png
  tldr: >
    A comprehensive review of diffusion models for structured data. We give a concise
    overview of score-based diffusion theory, then survey pioneering works across
    data-driven general tasks and domain-specific applications, and discuss the
    limitations and open directions of existing work.
  links:
