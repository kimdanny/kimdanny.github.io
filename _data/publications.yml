- title: "MoR: Better Handling Diverse Queries with a Mixture of Sparse, Dense, and Human Retrievers"
  authors: ["Jushaan Singh Kalra*", "Xinran Zhao*", "To Eun Kim", "Fengyu Cai",
            "Fernando Diaz", "Tongshuang Wu"]
  equal_note: true
  year: 2025
  venue: "EMNLP 2025 (Main)"
  venue_full: "Conference on Empirical Methods in Natural Language Processing"
  topics: [retrievers]
  selected: true
  image: /images/mor.png
  tldr: >
    Can we dynamically select and integrate multiple retrievers for each individual
    query, without the need for manual selection? In this work, we validate this
    intuition with quantitative analysis and introduce mixture of retrievers: a
    zero-shot, weighted combination of heterogeneous retrievers.
  links:
    paper: "https://aclanthology.org/2025.emnlp-main.601/"
    code: "https://github.com/Josh1108/MixtureRetrievers"

- title: "TeamCMU at Touché: Adversarial Co-Evolution for Advertisement Integration and Detection in Conversational Search"
  authors: ["To Eun Kim", "João Coelho", "Gbemileke Onilude", "Jai Singh"]
  year: 2025
